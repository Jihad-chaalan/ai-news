[project]
name = "ai-news-backend"
version = "0.1.0"
description = "AI Daily News backend – FastAPI + LangGraph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.24.0",
    "langgraph>=0.0.20",
    "langchain-core>=0.1.0",
    "supabase>=2.0.0",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=5.7.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
